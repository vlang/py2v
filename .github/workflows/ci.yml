name: CI

on:
  push:
    branches: [master, fix/ci-setup-vlang]
  pull_request:
    branches: [master]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Explicit test parallelism: a worker peaks near 0.25 GB,
      # so this stays CPU-bound with ample headroom.
      VJOBS: '4'
      # Stop a failing test session at its first failure instead of
      # running the whole suite to completion; the remaining files
      # add no signal.
      VTEST_FAIL_FAST: '1'
    timeout-minutes: 60

    steps:
      - name: Checkout code
        id: checkout_code
        uses: actions/checkout@v4

      - name: Setup V
        id: setup_v
        if: ${{ success() && !cancelled() && steps.checkout_code.outcome == 'success' }}
        uses: vlang/setup-v@v1.7

      - name: Build
        id: build
        if: ${{ success() && !cancelled() && steps.setup_v.outcome == 'success' }}
        run: v .

      - name: Run tests
        if: ${{ success() && !cancelled() && steps.build.outcome == 'success' }}
        id: tests
        shell: bash
        run: |
          set +e
          log_file="${{ runner.temp }}/py2v-tests.log"
          v tests/run_tests.vsh 2>&1 | tee "$log_file"
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          echo "log_file=$log_file" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Test summary
        if: always()
        shell: bash
        run: |
          log_file="${{ steps.tests.outputs.log_file }}"
          clean_log="${{ runner.temp }}/py2v-tests.clean.log"
          sed -r 's/\x1b\[[0-9;]*m//g' "$log_file" > "$clean_log"

          passed=0
          failed=0
          skipped=0
          if summary_line=$(grep -E "Summary:[[:space:]]+[0-9]+ passed,[[:space:]]+[0-9]+ failed,[[:space:]]+[0-9]+ skipped" "$clean_log" | tail -n1); then
            passed=$(echo "$summary_line" | sed -E 's/.*Summary:[[:space:]]+([0-9]+) passed,.*/\1/')
            failed=$(echo "$summary_line" | sed -E 's/.*Summary:[[:space:]]+[0-9]+ passed,[[:space:]]+([0-9]+) failed,.*/\1/')
            skipped=$(echo "$summary_line" | sed -E 's/.*Summary:[[:space:]]+[0-9]+ passed,[[:space:]]+[0-9]+ failed,[[:space:]]+([0-9]+) skipped.*/\1/')
          fi
          total=$((passed + failed + skipped))

          {
            echo "### Test Results (${{ matrix.os }})"
            echo ""
            echo "- Total: $total"
            echo "- Passed: $passed"
            echo "- Failed: $failed"
            echo "- Skipped: $skipped"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$failed" -gt 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "#### Failed Tests" >> "$GITHUB_STEP_SUMMARY"
            grep -E "^FAIL " "$clean_log" | sort -u | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Fail if tests failed
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.tests.outputs.exit_code }}" != "0" ]; then
            echo "Tests failed."
            exit 1
          fi
